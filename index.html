<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamerás vonalkód-teszt</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b79;--line:#d3dae1;--acc:#0a6a86;--acc-ink:#fff;--ok:#17603a;--ok-bg:#d9f1e2;--bad:#8a1c1c;--bad-bg:#f9d7d7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--panel:#192127;--ink:#e6ebef;--mute:#93a3b0;--line:#2b3741;--acc:#5cc3de;--acc-ink:#0b1a21;--ok:#9be3b9;--ok-bg:#16382a;--bad:#ffb4b4;--bad-bg:#4a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171c;--panel:#192127;--ink:#e6ebef;--mute:#93a3b0;--line:#2b3741;--acc:#5cc3de;--acc-ink:#0b1a21;--ok:#9be3b9;--ok-bg:#16382a;--bad:#ffb4b4;--bad-bg:#4a1d1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:0 0 6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.93rem}.row:last-child{border:0}
.yes{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;background:var(--acc);color:var(--acc-ink);width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.vid{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-top:12px}
video{display:block;width:100%;max-height:55vh;object-fit:cover}
.res{margin-top:12px;border-radius:10px;padding:12px 14px;background:var(--ok-bg);color:var(--ok);font-size:1.3rem;font-weight:700;word-break:break-all}
.err{margin-top:12px;border-radius:10px;padding:12px 14px;background:var(--bad-bg);color:var(--bad)}
.hint{color:var(--mute);font-size:.88rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Kamerás vonalkód-teszt</h1>
<p class="hint">Ezzel az egy perces próbával kiderül, hogy a telefonod böngészője el tudja-e olvasni a vonalkódot a kamerával. Nyomd meg az indítást, és tartsd a kamerát egy vonalkód elé, 15–25 cm-re, jó fényben.</p>

<div class="panel" id="diag"></div>

<button id="go">Kamera indítása</button>
<button class="ghost" id="stop" hidden>Leállítás</button>
<div class="vid" id="vbox" hidden><video id="v" playsinline muted autoplay></video></div>
<div id="out"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var stream=null,timer=null,det=null,reader=null,last='';
  function row(l,v,ok){
    var r=document.createElement('div');r.className='row';
    var a=document.createElement('span');a.textContent=l;
    var b=document.createElement('span');b.textContent=v;b.className=ok===true?'yes':ok===false?'no':'';
    r.appendChild(a);r.appendChild(b);$('diag').appendChild(r);
  }
  var secure=window.isSecureContext===true;
  var hasCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  var hasDet='BarcodeDetector' in window;
  var hasLib=(typeof ZXing!=='undefined');
  row('Biztonságos oldal (https)',secure?'igen':'nem',secure);
  row('Kamera-hozzáférés elérhető',hasCam?'igen':'nem',hasCam);
  row('Beépített vonalkódolvasó (Android)',hasDet?'igen':'nem',hasDet);
  row('Olvasókönyvtár (iPhone)',hasLib?'betöltve':'nem töltődött be',hasLib);
  function msg(t,cls){var o=$('out');o.innerHTML='';var d=document.createElement('div');d.className=cls;d.textContent=t;o.appendChild(d)}
  function stop(){
    if(timer){clearInterval(timer);timer=null}
    if(reader){try{reader.reset()}catch(e){}reader=null}
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    $('vbox').hidden=true;$('stop').hidden=true;$('go').hidden=false;
  }
  function beep(){
    try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
      o.frequency.value=880;g.gain.value=.1;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}
    try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  }
  function onCode(c,f){if(c&&c!==last){last=c;beep();msg(c+(f?'  ('+f+')':''),'res')}}
  function onErr(e){
    stop();var n=e&&e.name;
    msg(n==='NotAllowedError'?'A kamera használatát letiltotta a böngésző vagy az oldal. Engedélyezd a beállításokban, majd töltsd újra az oldalt.':
        n==='NotFoundError'?'Nem található kamera.':
        'Nem sikerült elindítani a kamerát ('+(n||'ismeretlen hiba')+').','err');
  }
  function startNative(){
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
      stream=s;var v=$('v');v.srcObject=s;v.play();
      return BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():[];
    }).then(function(f){
      det=new BarcodeDetector(f&&f.length?{formats:f}:undefined);
      msg('Keresem a vonalkódot…','hint');
      timer=setInterval(function(){
        det.detect($('v')).then(function(r){if(r&&r.length)onCode(r[0].rawValue,r[0].format)}).catch(function(){});
      },250);
    }).catch(onErr);
  }
  function startLib(){
    var B=ZXing.BarcodeFormat,H=new Map();
    H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[B.CODE_128,B.EAN_13,B.EAN_8,B.CODE_39,B.CODE_93,B.UPC_A,B.UPC_E,B.ITF,B.CODABAR]);
    H.set(ZXing.DecodeHintType.TRY_HARDER,true);
    reader=new ZXing.BrowserMultiFormatReader(H,200);
    msg('Keresem a vonalkódot…','hint');
    var p=reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},$('v'),function(res){
      if(res)onCode(res.getText(),B[res.getBarcodeFormat()]);
    });
    if(p&&p.catch)p.catch(onErr);
  }
  $('go').addEventListener('click',function(){
    $('out').innerHTML='';last='';
    if(!hasCam){msg('Ez az oldal nem fér hozzá a kamerához. Valószínűleg nem https címen van megnyitva, vagy beágyazott ablakban fut, ahol a böngésző nem engedi.','err');return}
    if(!hasDet&&!hasLib){msg('Nincs elérhető olvasó: a beépített nem létezik, a külső könyvtár pedig nem töltődött be.','err');return}
    $('vbox').hidden=false;$('stop').hidden=false;$('go').hidden=true;
    if(hasDet)startNative();else startLib();
  });
  $('stop').addEventListener('click',function(){stop()});
})();
</script>
</body>
</html>
